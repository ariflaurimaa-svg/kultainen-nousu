<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060919">
  <title>Kultainen Nousu – Tietovisa</title>
  <style>
    :root { --bg:#060919; --panel:#111b47; --gold:#f5c542; --text:#fff; --muted:#aab4ce; --green:#16a34a; --red:#dc2626 }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at top,#1b2e70,var(--bg) 70%); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    .app { width:min(1100px,calc(100% - 24px)); min-height:calc(100vh - 24px); margin:12px auto; display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:16px; padding:18px; border:1px solid rgba(245,197,66,.25); border-radius:18px; background:rgba(13,20,51,.94) }
    .main { display:flex; flex-direction:column; gap:16px; min-width:0 }
    .top,.status,.question,.ladder { border:1px solid rgba(245,197,66,.32); border-radius:14px; background:rgba(7,12,36,.72) }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px }
    h1 { margin:0; color:var(--gold); font-size:clamp(1.35rem,3vw,2.1rem) }
    .controls { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px }
    select,button { min-height:42px; border:1px solid rgba(245,197,66,.55); border-radius:10px; color:var(--text); background:#172356; padding:9px 12px; font:inherit }
    button { cursor:pointer } button:hover:not(:disabled){background:#22347d} button:disabled{cursor:not-allowed;opacity:.45}
    .status { min-height:90px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px }
    .timer { display:flex; align-items:center; gap:10px }
    .timer-circle { width:58px;height:58px;display:grid;place-items:center;border:3px solid var(--gold);border-radius:50%;color:var(--gold);font-size:1.4rem;font-weight:800 }
    .timer-circle.danger{border-color:#f87171;color:#fca5a5;animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
    .guaranteed{color:var(--gold);font-weight:700}.lifelines{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.lifeline.used{text-decoration:line-through;opacity:.45}
    .question { min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center }
    .category{color:var(--gold);font-size:.82rem;letter-spacing:1px;text-transform:uppercase} #questionText{max-width:800px;font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:700}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:72px;display:flex;align-items:center;text-align:left;gap:12px;padding:14px 16px;border:1.5px solid rgba(245,197,66,.55);background:#101942}.answer .letter{color:var(--gold);font-size:1.15rem;font-weight:900}.answer.selected{background:#9a5b10;border-color:#fde047}.answer.correct{background:var(--green)!important;border-color:#86efac!important}.answer.wrong{background:var(--red)!important;border-color:#fca5a5!important}.answer.hidden-option{visibility:hidden}
    .helper{min-height:52px;display:flex;align-items:center;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:rgba(37,99,235,.16)}.bottom{display:flex;justify-content:space-between;gap:12px}.start{color:#090d1f;border:none;background:linear-gradient(135deg,#d99b16,#f5c542);font-weight:800}
    .ladder{display:flex;align-items:center;padding:12px}#ladderList{width:100%;margin:0;padding:0;display:flex;flex-direction:column-reverse;list-style:none;gap:4px}.ladder-item{display:flex;justify-content:space-between;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:.9rem}.ladder-item.milestone{color:#ffe285;font-weight:800}.ladder-item.passed{color:#4ade80}.ladder-item.active{color:#060919;background:linear-gradient(90deg,#d97706,#f5c542);font-weight:900}
    .scoreboard{display:none;width:100%;padding:18px;border:1px solid rgba(245,197,66,.35);border-radius:14px;background:rgba(7,12,36,.78);text-align:center}.scoreboard.show{display:block}.scoreboard h2{color:var(--gold);margin:0 0 8px}.best-list{margin:10px auto 0;max-width:420px;padding:0;list-style:none}.best-list li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding:7px}
    @media(max-width:860px){.app{grid-template-columns:1fr;height:auto}.ladder{order:-1}#ladderList{max-height:260px;overflow-y:auto}}
    @media(max-width:600px){.top,.status,.bottom{align-items:stretch;flex-direction:column}.controls,.lifelines{justify-content:stretch}.controls select,.controls button,.lifelines button,.bottom button{flex:1}.answers{grid-template-columns:1fr}.app{width:calc(100% - 12px);margin:6px auto;padding:8px}.status{min-height:auto}.question{min-height:130px;padding:16px}}
  </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <header class="top"><h1>Kultainen Nousu</h1><div class="controls"><select id="themeSelect" aria-label="Teema"><option value="Kaikki aihealueet (yleistieto)">Yleistieto</option><option value="Suomen ja maailman historia">Historia</option><option value="Urheilu ja olympialaiset">Urheilu</option><option value="Musiikki, elokuvat ja popkulttuuri">Viihde</option><option value="Tiede, luonto ja avaruus">Tiede &amp; luonto</option><option value="Maantieto ja matkailu">Maantieto</option></select><select id="timeSelect" aria-label="Vastausaika"><option value="30">30 sekuntia</option><option value="45">45 sekuntia</option><option value="20">20 sekuntia</option><option value="0">Ei aikarajaa</option></select><button id="soundBtn" aria-pressed="true">🔊 Äänet: PÄÄLLÄ</button></div></header>
      <section class="status"><div class="timer"><div id="timerDisplay" class="timer-circle">30</div><div><div>Aikaa jäljellä</div><strong id="guaranteedDisplay" class="guaranteed">Turvataso: 0 €</strong></div></div><div class="lifelines"><button id="ll50" class="lifeline">50:50</button><button id="llAudience" class="lifeline">👥 Yleisö</button><button id="llPhone" class="lifeline">📞 Kilauta</button></div></section>
      <section id="scoreboard" class="scoreboard"><h2 id="resultTitle"></h2><div id="resultText"></div><ol id="bestList" class="best-list"></ol></section>
      <section class="question"><div id="categoryBadge" class="category">Tervetuloa peliin</div><div id="questionText">Valitse teema ja paina “Aloita uusi peli”.</div></section>
      <section id="answersGrid" class="answers"><button class="answer" data-index="0" disabled><span class="letter">A:</span><span class="answer-text">–</span></button><button class="answer" data-index="1" disabled><span class="letter">B:</span><span class="answer-text">–</span></button><button class="answer" data-index="2" disabled><span class="letter">C:</span><span class="answer-text">–</span></button><button class="answer" data-index="3" disabled><span class="letter">D:</span><span class="answer-text">–</span></button></section>
      <div id="helperMessage" class="helper">Tekoäly luo joka kierroksella uuden kysymyksen.</div>
      <footer class="bottom"><button id="walkAwayBtn" disabled>Ota rahat ja lopeta</button><button id="startBtn" class="start">▶ Aloita uusi peli</button></footer>
    </main><aside class="ladder"><ul id="ladderList"></ul></aside>
  </div>
  <script>
    const PRIZES=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
    const FALLBACK=[{q:"Mikä on Suomen pohjoisin kunta?",options:["Inari","Utsjoki","Enontekiö","Sodankylä"],correct:1,explanation:"Utsjoki on Suomen pohjoisin kunta."},{q:"Mikä on Suomen pääkaupunki?",options:["Turku","Helsinki","Tampere","Vaasa"],correct:1,explanation:"Helsinki on Suomen pääkaupunki."},{q:"Kuka sävelsi Finlandia-hymnin?",options:["Oskar Merikanto","Jean Sibelius","Leevi Madetoja","Toivo Kuula"],correct:1,explanation:"Jean Sibelius sävelsi Finlandian."},{q:"Kumpi näistä on planeetta?",options:["Mars","Jupiter","Kuu","Aurinko"],correct:1,explanation:"Jupiter on planeetta."},{q:"Minä vuonna Suomi voitti ensimmäisen jääkiekon MM-kultansa?",options:["1992","1995","1998","2011"],correct:1,explanation:"Suomi voitti ensimmäisen MM-kultansa 1995."}];
    const els={theme:document.getElementById("themeSelect"),time:document.getElementById("timeSelect"),timer:document.getElementById("timerDisplay"),guaranteed:document.getElementById("guaranteedDisplay"),category:document.getElementById("categoryBadge"),question:document.getElementById("questionText"),helper:document.getElementById("helperMessage"),answers:[...document.querySelectorAll(".answer")],ladder:document.getElementById("ladderList"),start:document.getElementById("startBtn"),walk:document.getElementById("walkAwayBtn"),sound:document.getElementById("soundBtn"),ll50:document.getElementById("ll50"),llAudience:document.getElementById("llAudience"),llPhone:document.getElementById("llPhone"),scoreboard:document.getElementById("scoreboard")};
    let state={level:0,playing:false,locked:false,question:null,history:[],timer:null,lifelines:{fifty:true,audience:true,phone:true}};
    let soundEnabled=true,audioContext=null;
    function tone(freq,d=.15){if(!soundEnabled)return;try{audioContext||=new(window.AudioContext||window.webkitAudioContext);const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.12,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+d);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+d)}catch(_){}}
    function renderLadder(){els.ladder.innerHTML="";PRIZES.forEach((amount,index)=>{const item=document.createElement("li");item.className="ladder-item";if([4,9,14].includes(index))item.classList.add("milestone");if(index<state.level)item.classList.add("passed");if(state.playing&&index===state.level)item.classList.add("active");item.innerHTML=`<span>${index+1}.</span><span>${amount.toLocaleString("fi-FI")} €</span>`;els.ladder.appendChild(item)})}
    function guaranteed(){return state.level>=10?32000:state.level>=5?1000:0}function prize(){return state.level===0?0:PRIZES[state.level-1]}
    function updateStatus(){renderLadder();els.guaranteed.textContent="Turvataso: "+guaranteed().toLocaleString("fi-FI")+" €";els.walk.textContent="💰 Ota rahat ja lopeta ("+prize().toLocaleString("fi-FI")+" €)";els.walk.disabled=!state.playing||state.locked||state.level===0}
    function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}els.timer.classList.remove("danger")}
    function startTimer(){stopTimer();const limit=Number(els.time.value);if(limit===0){els.timer.textContent="∞";return}let seconds=limit;els.timer.textContent=seconds;state.timer=setInterval(()=>{seconds--;els.timer.textContent=seconds;if(seconds<=5)els.timer.classList.add("danger");tone(seconds<=5?880:520,.06);if(seconds<=0){stopTimer();timeout()}},1000)}
    function resetAnswers(){els.answers.forEach(b=>{b.disabled=true;b.classList.remove("selected","correct","wrong","hidden-option");b.querySelector(".answer-text").textContent="..."})}
    async function loadQuestion(){state.locked=true;stopTimer();resetAnswers();updateStatus();els.category.textContent=`Porras ${state.level+1}/15 • ${PRIZES[state.level].toLocaleString("fi-FI")} €`;els.question.textContent="Luodaan uutta kysymystä...";els.helper.textContent="Odota hetki.";let question=null;try{const r=await fetch("/.netlify/functions/kysymys",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({level:state.level+1,theme:els.theme.value,avoid:state.history.slice(-15)})});if(r.ok){const d=await r.json();if(typeof d.q===="string"&&Array.isArray(d.options)&&d.options.length===4&&Number.isInteger(d.correct))question=d}}catch(_){}if(!question){question=FALLBACK[state.level%FALLBACK.length];els.helper.textContent="Varakysymys käytössä. Tekoälypalvelin ei ole käytettävissä."}else els.helper.textContent="Valitse vastaus ennen kuin aika loppuu.";state.question=question;state.history.push(question.q);els.question.textContent=question.q;els.answers.forEach((b,i)=>{b.querySelector(".answer-text").textContent=question.options[i];b.disabled=false});state.locked=false;updateStatus();startTimer()}
    function handleAnswer(index){if(!state.playing||state.locked)return;state.locked=true;stopTimer();els.answers.forEach(b=>b.disabled=true);els.answers[index].classList.add("selected");tone(440);setTimeout(()=>{const correct=state.question.correct;els.answers[index].classList.remove("selected");if(index===correct){els.answers[index].classList.add("correct");tone(660,.3);state.level++;if(state.level===PRIZES.length){els.helper.text.textContent="";endGame("win",1000000)}else{els.helper.textContent="✅ Oikein! "+(state.question.explanation||"")+" Siirrytään seuraavaan kysymykseen...";updateStatus();setTimeout(loadQuestion,1800)}}else{els.answers[index].classList.add("wrong");els.answers[correct].classList.add("correct");tone(180,.5);els.helper.textContent="❌ Väärin. Oikea vastaus oli "+["A","B","C","D"][correct]+". "+(state.question.explanation||"");endGame("lose",guaranteed())}},700)}
    function timeout(){if(!state.playing||state.locked)return;state.locked=true;const c=state.question.correct;els.answers.forEach(b=>b.disabled=true);els.answers[c].classList.add("correct");tone(180,.5);els.helper.textContent="⏰ Aika loppui! Oikea vastaus oli "+["A","B","C","D"][c]+".";endGame("timeout",guaranteed())}
    function bestResults(){try{return JSON.parse(localStorage.getItem("kultainenNousuResults")||"[]")}catch(_){return[]}}function saveResult(won,mode){const record={won,date:new Date().toISOString(),mode,level:state.level};const list=[record,...bestResults()].sort((a,b)=>b.won-a.won).slice(0,5);try{localStorage.setItem("kultainenNousuResults",JSON.stringify(list))}catch(_){}}
    function endGame(mode,won){state.playing=false;state.locked=true;stopTimer();els.answers.forEach(b=>b.disabled=true);[els.ll50,els.llAudience,els.llPhone].forEach(b=>b.disabled=true);els.walk.disabled=true;els.scoreboard.classList.add("show");saveResult(won,mode);document.getElementById("resultTitle").textContent=mode==="win"?"🏆 Miljoonan euron voitto":mode==="timeout"?"⏰ Aika päättyi":mode==="lose"?"Peli päättyi":"Peli päättyi";document.getElementById("resultText").textContent=`Voitit ${won.toLocaleString("fi-FI")} €. Pääsit portaalle ${state.level}/15.`;document.getElementById("bestList").innerHTML=bestResults().map(r=>`<li><span>${new Date(r.date).toLocaleDateString("fi-FI")}</span><strong>${r.won.toLocaleString("fi-FI")} €</strong></li>`).join("");renderLadder()}
    function startGame(){state.level=0;state.playing=true;state.locked=false;state.history=[];state.lifelines={fifty:true,audience:true,phone:true};[els.ll50,els.llAudience,els.llPhone].forEach(b=>{b.disabled=false;b.classList.remove("used")});els.scoreboard.classList.remove("show");els.start.textContent="🔄 Aloita alusta";loadQuestion()}
    els.ll50.addEventListener("click",()=>{if(!state.playing||state.locked||!state.lifelines.fifty)return;state.lifelines.fifty=false;els.ll50.disabled=true;els.ll50.classList.add("used");const c=state.question.correct,wrong=[0,1,2,3].filter(i=>i!==c);wrong.sort(()=>Math.random()-.5);wrong.slice(0,2).forEach(i=>{els.answers[i].classList.add("hidden-option");els.answers[i].disabled=true});els.helper.textContent="50:50 käytetty: kaksi väärää vastausta poistettiin."});
    els.llAudience.addEventListener("click",()=>{if(!state.playing||state.locked||!state.lifelines.audience)return;state.lifelines.audience=false;els.llAudience.disabled=true;els.llAudience.classList.add("used");const c=state.question.correct,p=Math.max(42,82-state.level*2),d=[0,0,0,0];d[c]=p;let left=100-p;[0,1,2,3].filter(i=>i!==c).forEach((i,x,a)=>{if(x===a.length-1)d[i]=left;else{const n=Math.floor(Math.random()*(left+1));d[i]=n;left-=n}});els.helper.textContent="👥 Yleisön äänet: "+d.map((v,i)=>["A","B","C","D"][i]+": "+v+"%").join(" | ")});
    els.llPhone.addEventListener("click",()=>{if(!state.playing||state.locked||!state.lifelines.phone)return;state.lifelines.phone=false;els.llPhone.disabled=true;els.llPhone.classList.add("used");const c=state.question.correct,i=state.level<10||Math.random()<.75?c:[0,1,2,3].find(x=>x!==c);els.helper.textContent="📞 Kaveri vastaa: "+["A","B","C","D"][i]+": "+state.question.options[i]});
    els.start.addEventListener("click",startGame);els.walk.addEventListener("click",()=>{if(!state.playing||state.locked||state.level===0)return;endGame("walk",prize());els.helper.textContent="💰 Lopetit ajoissa. Voitit "+prize().toLocaleString("fi-FI")+" €."});els.sound.addEventListener("click",()=>{soundEnabled=!soundEnabled;els.sound.textContent=soundEnabled?"🔊 Äänet: PÄÄLLÄ":"🔇 Äänet: POIS";els.sound.setAttribute("aria-pressed",String(soundEnabled));if(soundEnabled)tone(520)});els.answers.forEach(b=>b.addEventListener("click",()=>handleAnswer(Number(b.dataset.index))));renderLadder();
  </script>
</body>
</html>
