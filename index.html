<html lang="fi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060919"><title>Kultainen Nousu – Tietovisa</title>
<style>
:root{--bg:#060919;--panel:#111b47;--gold:#f5c542;--text:#fff;--muted:#aab4ce;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at top,#1b2e70,var(--bg) 70%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1100px,calc(100% - 24px));min-height:calc(100vh - 24px);margin:12px auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:18px;border:1px solid rgba(245,197,66,.25);border-radius:18px;background:rgba(13,20,51,.94)}.main{display:flex;flex-direction:column;gap:16px;min-width:0}.top,.status,.question,.ladder,.scoreboard{border:1px solid rgba(245,197,66,.32);border-radius:14px;background:rgba(7,12,36,.78)}.top,.status,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px}.controls,.lifelines{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}h1{margin:0;color:var(--gold);font-size:clamp(1.35rem,3vw,2.1rem)}select,button{min-height:42px;border:1px solid rgba(245,197,66,.55);border-radius:10px;color:var(--text);background:#172356;padding:9px 12px;font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.timer{display:flex;align-items:center;gap:10px}.timer-circle{width:58px;height:58px;display:grid;place-items:center;border:3px solid var(--gold);border-radius:50%;color:var(--gold);font-size:1.4rem;font-weight:800}.timer-circle.danger{border-color:#f87171;color:#fca5a5}.guaranteed,.category{color:var(--gold);font-weight:700}.question{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}.category{text-transform:uppercase;letter-spacing:1px}.questionText{max-width:800px;font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:700}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:72px;display:flex;align-items:center;text-align:left;gap:12px;padding:1 <body><div class="app"><main class="main">

<script>
'use strict';

const L={suomi:{locale:'fi-FI',html:'fi',title:'Kultainen Nousu – Tietovisa',themeLabel:'Teema',languageLabel:'Kieli',timeLabel:'Vastausaika',langs:['Suomi','Ruotsi','Englanti'],themes:['Yleistieto','Historia','Urheilu','Viihde','Tiede & luonto','Maantieto'],themeValues:['Kaikki aihealueet (yleistieto)','Suomen ja maailman historia','Urheilu ja olympialaiset','Musiikki, elokuvat ja popkulttuuri','Tiede, luonto ja avaruus','Maantieto ja matkailu'],times:['30 sekuntia','45 sekuntia','20 sekuntia','Ei aikarajaa'],soundOn:'🔊 Äänet: PÄÄLLÄ',soundOff:'🔇 Äänet: POIS',timeLeft:'Aikaa jäljellä',safe:'Turvataso',audience:'👥 Yleisö',phone:'📞 Kilauta',welcome:'Tervetuloa peliin',intro:'Valitse teema ja paina “Aloita uusi peli”.',helper:'Tekoäly luo joka kierroksella uuden kysymyksen.',walk:'Ota rahat ja lopeta',start:'▶ Aloita uusi peli',restart:'↻ Aloita alusta',step:'Porras',loading:'Luodaan uutta kysymystä…',wait:'Odota hetki.',fallback:'Varakysymys käytössä.',choose:'Valitse vastaus ennen kuin aika loppuu.',right:'Oikein!',next:'Siirrytään seuraavaan kysymykseen…',wrong:'Väärin.',correct:'Oikea vastaus oli',timeout:'Aika loppui! Oikea vastaus oli',win:'🎉 Miljoonan euron voitto',timeTitle:'⏰ Aika päättyi',endTitle:'Peli päättyi',won:'Voitit',level:'Pääsit portaalle',walkMsg:'💰 Lopetit ajoissa. Voitit',fifty:'50:50 käytetty: kaksi väärää vastausta poistettiin.',votes:'👥 Yleisön äänet:',friend:'📞 Kaveri vastaa:',exhausted:'Kaikki varakysymykset on jo esitetty. Yritä myöhemmin uudelleen.'},
ruotsi:{locale:'sv-SE',html:'sv',title:'Guldresan – frågespel',themeLabel:'Ämne',languageLabel:'Språk',timeLabel:'Svarstid',langs:['Finska','Svenska','Engelska'],themes:['Allmänbildning','Historia','Sport','Underhållning','Vetenskap & natur','Geografi'],themeValues:['Allmänbildning och allmän kunskap','Finlands och världens historia','Idrott och olympiska spel','Musik, film och populärkultur','Vetenskap, natur och rymden','Geografi och resor'],times:['30 sekunder','45 sekunder','20 sekunder','Ingen tidsgräns'],soundOn:'🔊 Ljud: PÅ',soundOff:'🔇 Ljud: AV',timeLeft:'Tid kvar',safe:'Garanterad nivå',audience:'👥 Publik',phone:'📞 Ring en vän',welcome:'Välkommen till spelet',intro:'Välj ett ämne och tryck på ”Starta nytt spel”.',helper:'AI skapar en ny fråga i varje omgång.',walk:'Ta pengarna och avsluta',start:'▶ Starta nytt spel',restart:'↻ Starta om',step:'Stege',loading:'Skapar en ny fråga…',wait:'Vänta lite.',fallback:'Reservfråga används.',choose:'Välj ett svar innan tiden går ut.',right:'Rätt!',next:'Vi går vidare till nästa fråga…',wrong:'Fel.',correct:'Rätt svar var',timeout:'Tiden är ute! Rätt svar var',win:'🎉 Du vann en miljon euro',timeTitle:'⏰ Tiden är ute',endTitle:'Spelet är slut',won:'Du vann',level:'Du nådde nivå',walkMsg:'💰 Du avslutade i tid. Du vann',fifty:'50:50 använt: två felaktiga svar har tagits bort.',votes:'👥 Publikens röster:',friend:'📞 Din vän svarar:',exhausted:'Alla reservfrågor har redan ställts. Försök igen senare.'},
englanti:{locale:'en-GB',html:'en',title:'Golden Rise – Quiz',themeLabel:'Topic',languageLabel:'Language',timeLabel:'Answer time',langs:['Finnish','Swedish','English'],themes:['General knowledge','History','Sports','Entertainment','Science & nature','Geography'],themeValues:['General knowledge','Finnish and world history','Sports and the Olympics','Music, film and pop culture','Science, nature and space','Geography and travel'],times:['30 seconds','45 seconds','20 seconds','No time limit'],soundOn:'🔊 Sound: ON',soundOff:'🔇 Sound: OFF',timeLeft:'Time left',safe:'Guaranteed level',audience:'👥 Audience',phone:'📞 Phone a friend',welcome:'Welcome to the game',intro:'Choose a topic and press “Start new game”.',helper:'AI creates a new question for every round.',walk:'Take the money and quit',start:'▶ Start new game',restart:'↻ Restart',step:'Level',loading:'Creating a new question…',wait:'Please wait.',fallback:'Using a backup question.',choose:'Choose an answer before time runs out.',right:'Correct!',next:'Moving to the next question…',wrong:'Wrong.',correct:'The correct answer was',timeout:'Time is up! The correct answer was',win:'🎉 You won one million euros',timeTitle:'⏰ Time is up',endTitle:'Game over',won:'You won',level:'You reached level',walkMsg:'💰 You stopped in time. You won',fifty:'50:50 used: two incorrect answers were removed.',votes:'👥 Audience votes:',friend:'📞 Your friend says:',exhausted:'All backup questions have already been used. Please try again later.'}};
const FB=[{q:['Mikä on Suomen pohjoisin kunta?','Vilken är Finlands nordligaste kommun?','What is Finland’s northernmost municipality?'],o:[['Inari','Utsjoki','Enontekiö','Sodankylä'],['Inari','Utsjoki','Enontekiö','Sodankylä'],['Inari','Utsjoki','Enontekiö','Sodankylä']],c:1,e:['Utsjoki on Suomen pohjoisin kunta.','Utsjoki är Finlands nordligaste kommun.','Utsjoki is Finland’s northernmost municipality.']},{q:['Mikä on Suomen pääkaupunki?','Vilken är Finlands huvudstad?','What is the capital of Finland?'],o:[['Turku','Helsinki','Tampere','Vaasa'],['Åbo','Helsingfors','Tammerfors','Vasa'],['Turku','Helsinki','Tampere','Vaasa']],c:1,e:['Helsinki on Suomen pääkaupunki.','Helsingfors är Finlands huvudstad.','Helsinki is the capital of Finland.']},{q:['Kuka sävelsi Finlandia-hymnin?','Vem komponerade Finlandia-hymnen?','Who composed the Finlandia hymn?'],o:[['Jean Sibelius','Oskar Merikanto','Leevi Madetoja','Toivo Kuula'],['Jean Sibelius','Oskar Merikanto','Leevi Madetoja','Toivo Kuula'],['Jean Sibelius','Oskar Merikanto','Leevi Madetoja','Toivo Kuula']],c:0,e:['Jean Sibelius sävelsi Finlandia-hymnin.','Jean Sibelius komponerade Finlandia-hymnen.','Jean Sibelius composed the Finlandia hymn.']},{q:['Mikä näistä on planeetta?','Vilken av dessa är en planet?','Which of these is a planet?'],o:[['Mars','Jupiter','Kuu','Aurinko'],['Mars','Jupiter','Månen','Solen'],['Mars','Jupiter','Moon','Sun']],c:1,e:['Jupiter on planeetta.','Jupiter är en planet.','Jupiter is a planet.']},{q:['Minä vuonna Suomi voitti ensimmäisen jääkiekon MM-kultansa?','Vilket år vann Finland sitt första VM-guld i ishockey?','In which year did Finland win its first ice hockey world championship?'],o:[['1992','1995','1998','2011'],['1992','1995','1998','2011'],['1992','1995','1998','2011']],c:1,e:['Suomi voitti ensimmäisen MM-kultansa vuonna 1995.','Finland vann sitt första VM-guld 1995.','Finland won its first world championship in 1995.']}];
const $=id=>document.getElementById(id),el={theme:$('themeSelect'),lang:$('languageSelect'),time:$('timeSelect'),timer:$('timerDisplay'),timeLeft:$('timeLeft'),safe:$('safe'),category:$('category'),question:$('question'),helper:$('helper'),answers:[...document.querySelectorAll('.answer')],ladder:$('ladderList'),start:$('start'),walk:$('walk'),sound:$('soundBtn'),fifty:$('fifty'),audience:$('audience'),phone:$('phone'),board:$('scoreboard')};
let s={level:0,playing:false,locked:false,q:null,history:[],timer:null,request:0,used:{fifty:true,audience:true,phone:true},result:null,sound:true};
const langNo=()=>({suomi:0,ruotsi:1,englanti:2}[el.lang.value]??0),t=k=>L[el.lang.value]?.[k]??L.suomi[k]??k,loc=()=>L[el.lang.value].locale;
function norm(x){return String(x||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()}
function readHistory(){try{const a=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.text==='string'):[]}catch(_){return[]}}
function addHistory(question){const key=norm(question);if(!key)return;const all=readHistory();if(!all.some(x=>x.key===key)){all.push({key,text:question,at:Date.now()});try{localStorage.setItem(HISTORY_KEY,JSON.stringify(all.slice(-MAX_HISTORY)))}catch(_){el.helper.textContent='Question history storage is full. Clear site storage to continue safely.'}}}
function seen(question){const key=norm(question);return !key||readHistory().some(x=>x.key===key)||s.history.some(x=>norm(x)===key)}
function renderLadder(){el.ladder.replaceChildren();PRIZES.forEach((v,i)=>{const li=document.createElement('li');li.className='ladder-item'+([4,9,14].includes(i)?' milestone':'')+(i<s.level?' passed':'')+(s.playing&&i===s.level?' active':'');li.innerHTML=`<span>${i+1}.</span><span>${v.toLocaleString(loc())} €</span>`;el.ladder.append(li)})}
function prize(){return s.level?PRIZES[s.level-1]:0}function safePrize(){return s.level>=10?32000:s.level>=5?1000:0}
function updateStatus(){renderLadder();el.safe.textContent=`${t('safe')}: ${safePrize().toLocaleString(loc())} €`;el.walk.textContent=`💰 ${t('walk')}${prize()?` (${prize().toLocaleString(loc())} €)`:''}`;el.walk.disabled=!s.playing||s.locked||!s.level}
function renderHistory(){let rows=[];try{rows=JSON.parse(localStorage.getItem('kultainenNousuResults')||'[]')}catch(_){}$('bestList').replaceChildren(...rows.slice(0,5).map(r=>{const li=document.createElement('li'),d=document.createElement('span'),v=document.createElement('strong');d.textContent=new Date(r.date).toLocaleDateString(loc());v.textContent=`${Number(r.won).toLocaleString(loc())} €`;li.append(d,v);return li}))}
function language(){const l=L[el.lang.value],n=langNo();document.documentElement.lang=l.html;document.title=l.title;el.theme.setAttribute('aria-label',t('themeLabel'));el.lang.setAttribute('aria-label',t('languageLabel'));el.time.setAttribute('aria-label',t('timeLabel'));[...el.lang.options].forEach((o,i)=>o.textContent=l.langs[i]);el.theme.replaceChildren(...l.themes.map((v,i)=>{const o=document.createElement('option');o.textContent=v;o.value=l.themeValues[i];return o}));[...el.time.options].forEach((o,i)=>o.textContent=l.times[i]);el.timeLeft.textContent=t('timeLeft');el.audience.textContent=t('audience');el.phone.textContent=t('phone');el.sound.textContent=s.sound?t('soundOn'):t('soundOff');el.start.textContent=s.playing?t('restart'):t('start');if(s.q&&s.playing){el.question.textContent=s.q.q;el.category.textContent=`${t('step')} ${s.level+1}/15 • ${PRIZES[s.level].toLocaleString(loc())} €`}else if(!s.playing){el.category.textContent=t('welcome');el.question.textContent=t('intro');el.helper.textContent=t('helper')}if(s.result){$('resultTitle').textContent=s.result.mode==='win'?t('win'):s.result.mode==='timeout'?t('timeTitle'):t('endTitle');$('resultText').textContent=`${t('won')} ${s.result.amount.toLocaleString(loc())} €. ${t('level')} ${s.result.level}/15.`;renderHistory()}updateStatus()}
function stopTimer(){clearInterval(s.timer);s.timer=null;el.timer.classList.remove('danger')}
function startTimer(){stopTimer();const max=Number(el.time.value);if(!max){el.timer.textContent='∞';return}let v=max;el.timer.textContent=v;s.timer=setInterval(()=>{el.timer.textContent=--v;if(v<=5)el.timer.classList.add('danger');if(v<=0){stopTimer();timeout()}},1000)}
function resetAnswers(){el.answers.forEach(b=>{b.disabled=true;b.classList.remove('selected','correct','wrong','hidden-option');b.querySelector('.answerText').textContent='–'})}
async function loadQuestion(){const request=++s.request;s.locked=true;stopTimer();resetAnswers();updateStatus();el.category.textContent=`${t('step')} ${s.level+1}/15 • ${PRIZES[s.level].toLocaleString(loc())} €`;el.question.textContent=t('loading');el.helper.textContent=t('wait');const lang=el.lang.value;let q=null;const past=readHistory().map(x=>x.text).concat(s.history).slice(-200);for(let attempt=0;attempt<3&&!q;attempt++){try{const r=await fetch('/.netlify/functions/kysymys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:s.level+1,theme:el.theme.value,language:lang,avoid:past,attempt})});if(r.ok){const d=await r.json();if(typeof d.q==='string'&&d.q.trim()&&Array.isArray(d.options)&&d.options.length===4&&d.options.every(x=>typeof x==='string'&&x.trim())&&Number.isInteger(d.correct)&&d.correct>=0&&d.correct<4&&!seen(d.q)){q={q:d.q.trim(),options:d.options,correct:d.correct,explanation:typeof d.explanation==='string'?d.explanation:''}}}}catch(_){}}if(request!==s.request||!s.playing)return;if(!q){const n=langNo(),f=FB.find(item=>!seen(item.q[n]));if(f){q={q:f.q[n],options:f.o[n],correct:f.c,explanation:f.e[n]};el.helper.textContent=t('fallback')}else{el.helper.textContent=t('exhausted');s.locked=true;el.start.disabled=false;el.start.textContent=t('start');s.playing=false;updateStatus();return}}else el.helper.textContent=t('choose');if(seen(q.q)){el.helper.textContent=t('exhausted');s.playing=false;s.locked=true;updateStatus();return}s.q=q;s.history.push(q.q);addHistory(q.q);el.question.textContent=q.q;el.answers.forEach((b,i)=>{b.querySelector('.answerText').textContent=q.options[i];b.disabled=false});s.locked=false;updateStatus();startTimer()}
function endGame(mode,amount){s.playing=false;s.locked=true;stopTimer();s.result={mode,amount,level:s.level};el.answers.forEach(b=>b.disabled=true);[el.fifty,el.audience,el.phone].forEach(b=>b.disabled=true);el.board.classList.add('show');let rows=[];try{rows=JSON.parse(localStorage.getItem('kultainenNousuResults')||'[]')}catch(_){}rows=[{won:amount,date:new Date().toISOString()},...rows].slice(0,5);try{localStorage.setItem('kultainenNousuResults',JSON.stringify(rows))}catch(_){}language();el.start.textContent=t('start');updateStatus()}
function startGame(){s.request++;s.level=0;s.playing=true;s.locked=false;s.q=null;s.history=[];s.result=null;s.used={fifty:true,audience:true,phone:true};[el.fifty,el.audience,el.phone].forEach(b=>{b.disabled=false;b.classList.remove('used')});el.board.classList.remove('show');el.start.textContent=t('restart');loadQuestion()}
function timeout(){if(!s.playing||s.locked||!s.q)return;s.locked=true;const c=s.q.correct;el.answers.forEach(b=>b.disabled=true);el.answers[c].classList.add('correct');el.helper.textContent=`⏰ ${t('timeout')} ${'ABCD'[c]}.`;endGame('timeout',safePrize())}
function answer(n){if(!s.playing||s.locked||!s.q)return;s.locked=true;stopTimer();el.answers.forEach(b=>b.disabled=true);el.answers[n].classList.add('selected');setTimeout(()=>{if(n===s.q.correct){el.answers[n].classList.replace('selected','correct');s.level++;if(s.level===PRIZES.length)endGame('win',1000000);else{el.helper.textContent=`${t('right')} ${t('next')} ${s.q.explanation||''}`;updateStatus();setTimeout(loadQuestion,1200)}}else{const c=s.q.correct;el.answers[n].classList.replace('selected','wrong');el.answers[c].classList.add('correct');el.helper.textContent=`${t('wrong')} ${t('correct')} ${'ABCD'[c]}. ${s.q.explanation||''}`;endGame('lose',safePrize())}},500)}
el.lang.addEventListener('change',()=>{language();if(s.playing)loadQuestion()});el.start.addEventListener('click',startGame);el.answers.forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i))));el.walk.addEventListener('click',()=>{if(!s.playing||s.locked||!s.level)return;const amount=prize();endGame('walk',amount);el.helper.textContent=`${t('walkMsg')} ${amount.toLocaleString(loc())} €.`});el.sound.addEventListener('click',()=>{s.sound=!s.sound;language()});
el.fifty.addEventListener('click',()=>{if(!s.playing||s.locked||!s.q||!s.used.fifty)return;s.used.fifty=false;el.fifty.disabled=true;el.fifty.classList.add('used');[0,1,2,3].filter(i=>i!==s.q.correct).sort(()=>Math.random()-.5).slice(0,2).forEach(i=>{el.answers[i].classList.add('hidden-option');el.answers[i].disabled=true});el.helper.textContent=t('fifty')});
el.audience.addEventListener('click',()=>{if(!s.playing||s.locked||!s.q||!s.used.audience)return;s.used.audience=false;el.audience.disabled=true;el.audience.classList.add('used');const c=s.q.correct,p=Math.max(42,82-s.level*2),d=[0,0,0,0];d[c]=p;let r=100-p;[0,1,2,3].filter(i=>i!==c).forEach((v,n,a)=>{d[v]=n===a.length-1?r:Math.floor(Math.random()*(r+1));r-=d[v]});el.helper.textContent=`${t('votes')} ${d.map((v,i)=>`${'ABCD'[i]}: ${v}%`).join(' | ')}`});
el.phone.addEventListener('click',()=>{if(!s.playing||s.locked||!s.q||!s.used.phone)return;s.used.phone=false;el.phone.disabled=true;el.phone.classList.add('used');const c=s.q.correct,i=s.level<10||Math.random()<.75?c:[0,1,2,3].find(x=>x!==c);el.helper.textContent=`${t('friend')} ${'ABCD'[i]}: ${s.q.options[i]}`});language();
</script></body></html>
