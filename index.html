const $=id=>document.getElementById(id),els={theme:$('themeSelect'),language:$('languageSelect'),time:$('timeSelect'),timer:$('timerDisplay'),safe:$('guaranteedDisplay'),timeLeft:$('timeLeftText'),category:$('categoryBadge'),question:$('questionText'),helper:$('helperMessage'),answers:[...document.querySelectorAll('.answer')],ladder:$('ladderList'),start:$('startBtn'),walk:$('walkAwayBtn'),sound:$('soundBtn'),fifty:$('ll50'),audience:$('llAudience'),phone:$('llPhone'),board:$('scoreboard')};
let state={level:0,playing:false,locked:false,question:null,history:[],timer:null,request:0,lifelines:{fifty:true,audience:true,phone:true},result:null,sound:true,audio:null};
const langIndex=()=>({suomi:0,ruotsi:1,englanti:2}[els.language.value]??0),tr=key=>I18N[els.language.value]?.[key]??I18N.suomi[key]??key,locale=()=>I18N[els.language.value].locale;
function renderLadder(){els.ladder.replaceChildren();PRIZES.forEach((v,i)=>{const li=document.createElement('li');li.className='ladder-item'+([4,9,14].includes(i)?' milestone':'')+(i<state.level?' passed':'')+(state.playing&&i===state.level?' active':'');li.innerHTML=`<span>${i+1}.</span><span>${v.toLocaleString(locale())} €</span>`;els.ladder.append(li)})}
function guaranteed(){return state.level>=10?32000:state.level>=5?1000:0}function prize(){return state.level?PRIZES[state.level-1]:0}
function updateStatus(){renderLadder();els.safe.textContent=`${tr('safe')}: ${guaranteed().toLocaleString(locale())} €`;els.walk.textContent=`💰 ${tr('walk')}${prize()?` (${prize().toLocaleString(locale())} €)`:''}`;els.walk.disabled=!state.playing||state.locked||!state.level}
function showResults(){if(!state.result)return;const {mode,amount,level}=state.result;$('resultTitle').textContent=mode==='win'?tr('win'):mode==='timeout'?tr('timeTitle'):tr('endTitle');$('resultText').textContent=`${tr('won')} ${amount.toLocaleString(locale())} €. ${tr('level')} ${level}/15.`;let rows=[];try{rows=JSON.parse(localStorage.getItem('kultainenNousuResults')||'[]')}catch(_){}$('bestList').replaceChildren(...rows.slice(0,5).map(r=>{const li=document.createElement('li'),date=document.createElement('span'),score=document.createElement('strong');date.textContent=new Date(r.date).toLocaleDateString(locale());score.textContent=`${Number(r.won).toLocaleString(locale())} €`;li.append(date,score);return li}))}

function tone(freq,d=.15){if(!state.sound)return;try{state.audio??=new(window.AudioContext||window.webkitAudioContext)();const o=state.audio.createOscillator(),g=state.audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.12,state.audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,state.audio.currentTime+d);o.connect(g);g.connect(state.audio.destination);o.start();o.stop(state.audio.currentTime+d)}catch(_){}}

function startTimer(){stopTimer();const limit=Number(els.time.value);if(!limit){els.timer.textContent='∞';return}let s=limit;els.timer.textContent=s;state.timer=setInterval(()=>{els.timer.textContent=--s;if(s<=5)els.timer.classList.add('danger');if(s<=0){stopTimer();timeout()}},1000)}

async function loadQuestion(){const request=++state.request;state.locked=true;stopTimer();resetAnswers();updateStatus();els.category.textContent=`${tr('step')} ${state.level+1}/15 • ${PRIZES[state.level].toLocaleString(locale())} €`;els.question.textContent=tr('loading');els.helper.textContent=tr('wait');const lang=els.language.value;let q=null;try{const r=await fetch('/.netlify/functions/kysymys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:state.level+1,theme:els.theme.value,language:lang,avoid:state.history.slice(-15)})});if(r.ok){const d=await r.json();if(typeof d.q==='string'&&d.q.trim()&&Array.isArray(d.options)&&d.options.length===4&&d.options.every(x=>typeof x==='string'&&x.trim())&&Number.isInteger(d.correct)&&d.correct>=0&&d.correct<4)q=d}}catch(_){}if(request!==state.request||!state.playing)return;if(!q){const f=FALLBACK[state.level%FALLBACK.length],i=({suomi:0,ruotsi:1,englanti:2})[lang];q={q:f.q[i],options:f.o[i],correct:f.c,explanation:f.e[i]};els.helper.textContent=tr('fallback')}else els.helper.textContent=tr('choose');state.question=q;state.history.push(q.q);els.question.textContent=q.q;els.answers.forEach((b,i)=>{b.querySelector('.answer-text').textContent=q.options[i];b.disabled=false});state.locked=false;updateStatus();startTimer()}
function endGame(mode,amount){state.playing=false;state.locked=true;stopTimer();state.result={mode,amount,level:state.level};els.answers.forEach(b=>b.disabled=true);[els.fifty,els.audience,els.phone].forEach(b=>b.disabled=true);els.board.classList.add('show');let rows=[];try{rows=JSON.parse(localStorage.getItem('kultainenNousuResults')||'[]')}catch(_){}rows=[{won:amount,date:new Date().toISOString()},...rows].slice(0,5);try{localStorage.setItem('kultainenNousuResults',JSON.stringify(rows))}catch(_){}showResults();els.start.textContent=tr('start');updateStatus()}
function startGame(){state.request++;state.level=0;state.playing=true;state.locked=false;state.question=null;state.history=[];state.result=null;state.lifelines={fifty:true,audience:true,phone:true};[els.fifty,els.audience,els.phone].forEach(b=>{b.disabled=false;b.classList.remove('used')});els.board.classList.remove('show');els.start.textContent=tr('restart');loadQuestion()}

function answer(n){if(!state.playing||state.locked||!state.question)return;state.locked=true;stopTimer();els.answers.forEach(b=>b.disabled=true);els.answers[n].classList.add('selected');tone(440);setTimeout(()=>{if(n===state.question.correct){els.answers[n].classList.replace('selected','correct');tone(660,.3);state.level++;if(state.level===PRIZES.length)endGame('win',1000000);else{els.helper.textContent=`${tr('right')} ${tr('next')} ${state.question.explanation||''}`;updateStatus();setTimeout(loadQuestion,1500)}}else{const c=state.question.correct;els.answers[n].classList.replace('selected','wrong');els.answers[c].classList.add('correct');els.helper.textContent=`❌ ${tr('wrong')} ${tr('correct')} ${'ABCD'[c]}. ${state.question.explanation||''}`;endGame('lose',guaranteed())}},600)}

els.fifty.addEventListener('click',()=>{if(!state.playing||state.locked||!state.question||!state.lifelines.fifty)return;state.lifelines.fifty=false;els.fifty.disabled=true;els.fifty.classList.add('used');const wrong=[0,1,2,3].filter(i=>i!==state.question.correct).sort(()=>Math.random()-.5);wrong.slice(0,2).forEach(i=>{els.answers[i].classList.add('hidden-option');els.answers[i].disabled=true});els.helper.textContent=tr('fifty')});
els.audience.addEventListener('click',()=>{if(!state.playing||state.locked||!state.question||!state.lifelines.audience)return;state.lifelines.audience=false;els.audience.disabled=true;els.audience.classList.add('used');const c=state.question.correct,p=Math.max(42,82-state.level*2),d=[0,0,0,0];d[c]=p;let rest=100-p;[0,1,2,3].filter(i=>i!==c).forEach((v,n,a)=>{d[v]=n===a.length-1?rest:Math.floor(Math.random()*(rest+1));rest-=d[v]});els.helper.textContent=`${tr('votes')} ${d.map((v,i)=>`${'ABCD'[i]}: ${v}%`).join(' | ')}`});
els.phone.addEventListener('click',()=>{if(!state.playing||state.locked||!state.question||!state.lifelines.phone)return;state.lifelines.phone=false;els.phone.disabled=true;els.phone.classList.add('used');const c=state.question.correct,i=state.level<10||Math.random()<.75?c:[0,1,2,3].find(x=>x!==c);els.helper.textContent=`${tr('friend')} ${'ABCD'[i]}: ${state.question.options[i]}`});
updateLanguage();
</script>
