<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060919">
  <meta name="description" content="Kultainen Nousu - tietovisapeli">
  <title>Kultainen Nousu – Tietovisa</title>
  <style>
    :root{color-scheme:dark;--bg:#060919;--panel:#111b47;--gold:#f5c542;--text:#fff;--muted:#c5cde0;--green:#16783a;--red:#a92828;--focus:#fff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at top,#1b2e70,var(--bg) 70%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
    button,select{font:inherit}
    button,select{min-height:44px;border:1px solid #b99427;border-radius:10px;color:var(--text);background:#172356;padding:.65rem .8rem}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.65}
    :focus-visible{outline:3px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 5px #172356}
    .skip-link{position:absolute;top:-100px;left:1rem;z-index:5;padding:.75rem 1rem;background:#fff;color:#111;border-radius:8px}
    .skip-link:focus{top:1rem}
    .app{width:min(1100px,calc(100% - 24px));min-height:calc(100vh - 24px);margin:12px auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:18px;border:1px solid #67551d;border-radius:18px;background:rgba(13,20,51,.96)}
    .main{display:flex;flex-direction:column;gap:16px;min-width:0}
    .top,.status,.question,.ladder,.scoreboard{border:1px solid #67551d;border-radius:14px;background:rgba(7,12,36,.9)}
    .top,.status,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px}
    .controls,.lifelines{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
    h1{margin:0;color:var(--gold);font-size:clamp(1.35rem,3vw,2.1rem);line-height:1.2}
    h2{color:var(--gold)}
    .timer{display:flex;align-items:center;gap:12px}
    .timer-circle{width:58px;height:58px;flex:none;display:grid;place-items:center;border:3px solid var(--gold);border-radius:50%;color:var(--gold);font-size:1.4rem;font-weight:800}
    .timer-circle.danger{border-color:#ff8b8b;color:#ffb1b1}
    .guaranteed,.category{color:#ffe285;font-weight:700}
    .question{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
    .category{text-transform:uppercase;letter-spacing:1px}
    .questionText{max-width:800px;font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:700}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .answer{min-height:72px;display:flex;align-items:center;text-align:left;gap:12px;padding:14px 16px;background:#101942}
    .letter{flex:none;color:#ffe285;font-size:1.15rem;font-weight:900}
    .answer.correct{background:var(--green);border-color:#91e6a8}
    .answer.wrong{background:var(--red);border-color:#ffaaaa}
    .answer[hidden]{display:none}
    .helper{min-height:52px;display:flex;align-items:center;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#172b59}
    .start{color:#090d1f;background:linear-gradient(135deg,#e1ad2e,#ffe285);font-weight:800}
    .ladder{display:flex;align-items:center;padding:12px}
    #ladderList{width:100%;margin:0;padding:0;display:flex;flex-direction:column-reverse;list-style:none;gap:4px}
    .ladder-item{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;color:var(--muted)}
    .milestone{color:#ffe285;font-weight:800}
    .passed{color:#8bf0a7}
    .active{color:#060919;background:linear-gradient(90deg,#d97706,#ffe285);font-weight:900;border-radius:5px}
    .scoreboard{display:none;padding:18px;text-align:center}
    .scoreboard.show{display:block}
    .best-list{max-width:420px;margin:10px auto;padding:0;list-style:none}
    .best-list li{display:flex;justify-content:space-between;gap:12px;padding:7px;border-bottom:1px solid #ffffff38}
    .visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-width:860px){.app{grid-template-columns:1fr}.ladder{order:1}#ladderList{max-height:260px;overflow:auto}}
    @media(max-width:600px){.top,.status,.bottom{align-items:stretch;flex-direction:column}.controls,.lifelines{justify-content:stretch}.controls select,.controls button,.lifelines button,.bottom button{flex:1;min-width:0}.answers{grid-template-columns:1fr}.app{width:calc(100% - 12px);margin:6px auto;padding:8px;gap:10px}.main{gap:10px}.question{padding:18px 12px}.timer{align-items:flex-start}.top{gap:14px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>

      <footer class="bottom"><button id="walk" type="button" disabled></button><button id="start" class="start" type="button"></button></footer>
    </main>
    <aside class="ladder" aria-label="Voittoporras"><ol id="ladderList"></ol></aside>
  </div>

let s={level:0,playing:false,locked:false,q:null,history:[],timer:null,request:0,used:{fifty:true,audience:true,phone:true},result:null,sound:true};
const langNo=()=>({suomi:0,ruotsi:1,englanti:2}[el.lang.value]??0),t=k=>TEXT[el.lang.value]?.[k]??TEXT.suomi[k]??k,loc=()=>TEXT[el.lang.value].locale;
function norm(x){return String(x||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()}
function readHistory(){try{const a=JSON.parse(localStorage.getItem('kultainenNousuAskedQuestionsV1')||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.text==='string'):[]}catch(_){return[]}}

async function loadQuestion(){const request=++s.request;s.locked=true;stopTimer();resetAnswers();updateStatus();el.category.textContent=`${t('step')} ${s.level+1}/15 • ${PRIZES[s.level].toLocaleString(loc())} €`;el.question.textContent=t('loading');el.helper.textContent=t('wait');const lang=el.lang.value;let q=null;const past=readHistory().map(x=>x.text).concat(s.history).slice(-200);for(let attempt=0;attempt<3&&!q;attempt++){try{const r=await fetch('/.netlify/functions/kysymys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:s.level+1,theme:el.theme.value,language:lang,avoid:past,attempt})});if(r.ok){const d=await r.json();if(typeof d.q==='string'&&d.q.trim()&&Array.isArray(d.options)&&d.options.length===4&&d.options.every(x=>typeof x==='string'&&x.trim())&&Number.isInteger(d.correct)&&d.correct>=0&&d.correct<4&&!seen(d.q)){q={q:d.q.trim(),options:d.options,correct:d.correct,explanation:typeof d.explanation==='string'?d.explanation:''}}}}catch(_){}}if(request!==s.request||!s.playing)return;if(!q){const n=langNo(),f=FB.find(item=>!seen(item.q[n]));if(f){q={q:f.q[n],options:f.o[n],correct:f.c,explanation:f.e[n]};el.helper.textContent=t('fallback')}else{el.helper.textContent=t('exhausted');s.locked=true;el.start.disabled=false;el.start.textContent=t('start');s.playing=false;updateStatus();return}}else el.helper.textContent=t('choose');if(seen(q.q)){el.helper.textContent=t('exhausted');s.playing=false;s.locked=true;updateStatus();return}s.q=q;s.history.push(q.q);addHistory(q.q);el.question.textContent=q.q;el.answers.forEach((b,i)=>{b.querySelector('.answerText').textContent=q.options[i];b.disabled=false});s.locked=false;updateStatus();startTimer()}
function endGame(mode,amount){s.playing=false;s.locked=true;stopTimer();s.result={mode,amount,level:s.level};el.answers.forEach(b=>b.disabled=true);[el.fifty,el.audience,el.phone].forEach(b=>b.disabled=true);el.board.classList.add('show');let rows=[];try{rows=JSON.parse(localStorage.getItem('kultainenNousuResults')||'[]')}catch(_){}rows=[{won:amount,date:new Date().toISOString()},...rows].slice(0,5);try{localStorage.setItem('kultainenNousuResults',JSON.stringify(rows))}catch(_){}language();el.start.textContent=t('start');updateStatus();el.board.focus()}
function startGame(){s.request++;s.level=0;s.playing=true;s.locked=false;s.q=null;s.history=[];s.result=null;s.used={fifty:true,audience:true,phone:true};[el.fifty,el.audience,el.phone].forEach(b=>{b.disabled=false;b.classList.remove('used')});el.board.classList.remove('show');el.start.textContent=t('restart');loadQuestion()}
function timeout(){if(!s.playing||s.locked||!s.q)return;s.locked=true;const c=s.q.correct;el.answers.forEach(b=>b.disabled=true);el.answers[c].classList.add('correct');el.helper.textContent=`⏰ ${t('timeout')} ${'ABCD'[c]}. ${s.q.explanation||''}`;endGame('timeout',safePrize())}
function answer(n){if(!s.playing||s.locked||!s.q)return;s.locked=true;stopTimer();el.answers.forEach(b=>b.disabled=true);el.answers[n].classList.add('selected');setTimeout(()=>{if(n===s.q.correct){el.answers[n].classList.add('correct');s.level++;if(s.level===PRIZES.length)endGame('win',1000000);else{el.helper.textContent=`${t('right')} ${s.q.explanation||''} ${t('next')}`;updateStatus();setTimeout(loadQuestion,900)}}else{const c=s.q.correct;el.answers[n].classList.add('wrong');el.answers[c].classList.add('correct');el.helper.textContent=`${t('wrong')} ${t('correct')} ${'ABCD'[c]}. ${s.q.explanation||''}`;endGame('lose',safePrize())}},300)}
el.lang.addEventListener('change',()=>{language();if(s.playing)loadQuestion()});el.start.addEventListener('click',startGame);el.answers.forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i))));el.walk.addEventListener('click',()=>{if(!s.playing||s.locked||!s.level)return;const amount=prize();endGame('walk',amount);el.helper.textContent=`${t('walkMsg')} ${amount.toLocaleString(loc())} €.`});el.sound.addEventListener('click',()=>{s.sound=!s.sound;language()});
el.fifty.addEventListener('click',()=>{if(!s.playing||s.locked||!s.q||!s.used.fifty)return;s.used.fifty=false;el.fifty.disabled=true;[0,1,2,3].filter(i=>i!==s.q.correct).sort(()=>Math.random()-.5).slice(0,2).forEach(i=>{el.answers[i].hidden=true;el.answers[i].disabled=true});el.helper.textContent=t('fifty')});
el.audience.addEventListener('click',()=>{if(!s.playing||s.locked||!s.q||!s.used.audience)return;s.used.audience=false;el.audience.disabled=true;const c=s.q.correct,p=Math.max(42,82-s.level*2),d=[0,0,0,0];d[c]=p;let r=100-p;[0,1,2,3].filter(i=>i!==c).forEach((v,n)=>{d[v]=n===2?r:Math.floor(Math.random()*(r+1));r-=d[v]});el.helper.textContent=`${t('votes')} ${d.map((v,i)=>`${'ABCD'[i]}: ${v}%`).join(' | ')}`});
el.phone.addEventListener('click',()=>{if(!s.playing||s.locked||!s.q||!s.used.phone)return;s.used.phone=false;el.phone.disabled=true;const c=s.q.correct,i=s.level<10||Math.random()<.75?c:[0,1,2,3].find(x=>x!==c);el.helper.textContent=`${t('friend')} ${'ABCD'[i]}: ${s.q.options[i]}`});
document.addEventListener('keydown',event=>{if(!s.playing||s.locked||!s.q||!['1','2','3','4'].includes(event.key))return;if(event.target instanceof HTMLInputElement||event.target instanceof HTMLSelectElement||event.target instanceof HTMLTextAreaElement)return;event.preventDefault();answer(Number(event.key)-1)});
language();
</script>
</body>
